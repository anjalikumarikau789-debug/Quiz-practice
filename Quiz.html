<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz App - By Anjali Kumari</title>
<link rel="stylesheet" href="Quiz.css">
</head>
<body>

<header>
  <h1>DecodeLabs Quiz App</h1>
  <p>Project 2 | By Anjali Kumari</p>
</header>

<main class="quiz-section" id="quizBox">
  <div class="top">
    <span id="qCount">Question 1 / 5</span>
    <span id="scoreText">Score: 0</span>
  </div>
  <div class="progress"><div id="progressBar"></div></div>
  <h2 id="question">Loading...</h2>
  <div id="options"></div>
  <button id="nextBtn" disabled>Next Question →</button>
</main>

<section class="quiz-section" id="result">
  <h2>🎉 Quiz Completed!</h2>
  <p id="finalScore"></p>
  <p id="message"></p>
  <button id="nextBtn" onclick="location.reload()">Play Again</button>
</section>

<footer>Made by Anjali Kumari | HTML, CSS, JS Only</footer>

<script src="Quiz.js"></script>
</body>
</html>
